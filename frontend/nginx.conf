worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Gzip static assets for faster first paint
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Don't advertise the nginx version in response headers
    server_tokens off;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Reverse-proxy API and uploaded media to the backend container so the
        # browser only ever talks to this one origin (mirrors vite dev's proxy).
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://backend:8000/uploads/;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://backend:8000/health;
        }

        location = /about {
            try_files /about/index.html =404;
        }

        location = /privacy {
            try_files /privacy/index.html =404;
        }

        location = /terms {
            try_files /terms/index.html =404;
        }

        location = /data-deletion {
            try_files /data-deletion/index.html =404;
        }

        # SPA fallback — client-side routing (react-router-dom)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Long-cache hashed build assets, never cache the HTML shell
        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}

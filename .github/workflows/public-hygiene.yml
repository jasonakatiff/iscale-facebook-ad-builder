name: Public content hygiene

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check content policy and its regression tests
        run: |
          python -m unittest discover -s tests -p test_public_hygiene.py
          python scripts/check_public_hygiene.py
      - name: Scan tracked content for secrets
        run: |
          git archive HEAD | tar -x -C "$RUNNER_TEMP" --one-top-level=public-source
          docker run --rm -v "$RUNNER_TEMP/public-source:/scan:ro" zricethezav/gitleaks:v8.30.0 dir /scan --redact=100 --no-banner

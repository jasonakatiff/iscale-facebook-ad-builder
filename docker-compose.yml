# Local development stack: hot-reloading backend + frontend against a
# disposable Postgres for optional self-hosted development.
#
# Usage: docker compose up
#   backend:  http://localhost:8000  (uvicorn --reload)
#   frontend: http://localhost:5173  (vite dev server, proxies /api to backend)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ads_studio_dev
      POSTGRES_USER: ads_studio
      POSTGRES_PASSWORD: ads_studio_dev_password
    volumes:
      - ads_studio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads_studio -d ads_studio_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ads_studio:ads_studio_dev_password@postgres:5432/ads_studio_dev
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      FRONTEND_URL: http://localhost:5173
      GOOGLE_ADS_OAUTH_REDIRECT_URI: http://localhost:8000/api/v1/google-ads/oauth/callback
      TIKTOK_ADS_OAUTH_REDIRECT_URI: http://localhost:8000/api/v1/tiktok-ads/oauth/callback
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      # Used by vite dev's own proxy for relative-path requests (container-to-container)
      VITE_BACKEND_PROXY_TARGET: http://backend:8000
      # Browser requests use the backend port published on the host.
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  ads_studio_postgres_data:

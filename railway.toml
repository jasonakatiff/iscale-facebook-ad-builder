# Railway configuration for the backend service.
#
# This file configures one Railway service. The frontend has its own config at
# /frontend/railway.toml. In Railway, keep the backend service root directory
# at / so the Docker build context includes backend/.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "python startup.py"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
